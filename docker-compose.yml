# Z-Push ActiveSync gateway (IMAP backend) behind caddy-docker-proxy
#
# Routing uses lucaslorentz/caddy-docker-proxy labels:
#   https://github.com/lucaslorentz/caddy-docker-proxy
# Network must match Caddy's ingress network (often named "caddy").
#
#   cp .env.example .env   # edit IMAP/SMTP + EAS_DOMAIN / AUTODISCOVER_DOMAIN
#   docker compose pull && docker compose up -d
#
# All settings come from .env (env_file). Label values (hostnames) are
# interpolated by compose from the same .env.
#
# Local build:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  z-push:
    image: ${IMAGE:-ghcr.io/heyink/z-push-docker:latest}
    container_name: z-push
    restart: unless-stopped
    env_file: .env
    expose:
      - "80"
    volumes:
      - zpush_state:/var/lib/z-push
      - zpush_logs:/var/log/z-push
    networks:
      - caddy_net
    logging: *logging
    security_opt:
      - no-new-privileges:true
    labels:
      # Site block from env (compose interpolates before creating the container).
      # Multi-domain: https://github.com/lucaslorentz/caddy-docker-proxy#examples
      caddy: "${EAS_DOMAIN:-eas.example.com}, ${AUTODISCOVER_DOMAIN:-autodiscover.example.com}"
      # Quote templates in YAML — https://github.com/lucaslorentz/caddy-docker-proxy#upstreams
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.transport: http
      caddy.reverse_proxy.transport.read_timeout: 30m
      caddy.reverse_proxy.transport.write_timeout: 30m
      caddy.reverse_proxy.transport.response_header_timeout: 30m
    healthcheck:
      # Unauthenticated request must reach Z-Push and return 401 (500 = PHP/config error)
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -A zpush-healthcheck -w '%{http_code}' http://127.0.0.1/Microsoft-Server-ActiveSync) && [ \"$$code\" = 401 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  greenmail:
    profiles: ["test"]
    image: greenmail/standalone:2.1.2
    container_name: z-push-greenmail
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.users=test:test@example.com
        -Dgreenmail.hostname=0.0.0.0
    networks:
      - caddy_net
    logging: *logging

volumes:
  zpush_state:
  zpush_logs:

networks:
  caddy_net:
    name: ${CADDY_NETWORK:-caddy}
    external: true
